<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>親機 — 接続テスト</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f1117; color: #eef0f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 28px; padding: 24px 36px;
    border-bottom: 1px solid #22262f;
  }
  #qr { width: 128px; height: 128px; background: #fff; border-radius: 12px; padding: 8px; flex: none; }
  .lead { font-size: 14px; color: #8b93a7; letter-spacing: .08em; }
  #url { font-size: 30px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #conn { margin-left: auto; font-size: 14px; display: flex; align-items: center; gap: 9px; color: #8b93a7; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #f87171; }
  #dot.on { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

  main { flex: 1; padding: 36px; }
  #empty { color: #5c6478; font-size: 17px; text-align: center; margin-top: 80px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }

  .card {
    border: 2px solid var(--c); border-radius: 16px; padding: 20px;
    background: color-mix(in srgb, var(--c) 9%, #171a22);
    transition: transform .12s ease, box-shadow .25s ease;
  }
  .card.hit { transform: scale(1.06); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 45%, transparent); }
  .card .nm { font-size: 21px; font-weight: 700; color: var(--c); }
  .card .ct { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .card .lb { font-size: 12px; color: #8b93a7; letter-spacing: .1em; }

  #log {
    border-top: 1px solid #22262f; padding: 14px 36px; font-size: 13px;
    color: #6b7385; font-family: ui-monospace, Consolas, monospace;
    height: 108px; overflow-y: auto;
  }
  #log div { padding: 2px 0; }
</style>
</head>
<body>
  <header>
    <img id="qr" src="/qr.svg" alt="参加用QRコード">
    <div>
      <div class="lead">スマホでQRを読むか、ブラウザで次を開く</div>
      <div id="url">…</div>
    </div>
    <div id="conn"><span id="dot"></span><span id="cs">未接続</span></div>
  </header>

  <main>
    <div id="empty">参加者を待っています…</div>
    <div id="grid"></div>
  </main>

  <div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const cards = new Map();
let ws = null;

function log(text) {
  const el = document.createElement("div");
  el.textContent = `${new Date().toLocaleTimeString("ja-JP")}  ${text}`;
  $("log").prepend(el);
  while ($("log").childElementCount > 60) $("log").lastElementChild.remove();
}

function render(players) {
  $("empty").style.display = players.length ? "none" : "block";
  const alive = new Set(players.map((p) => p.id));
  for (const [id, el] of cards) {
    if (!alive.has(id)) { el.remove(); cards.delete(id); }
  }
  for (const p of players) {
    let el = cards.get(p.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "card";
      el.style.setProperty("--c", p.color);
      el.innerHTML = `<div class="nm"></div><div class="ct">0</div><div class="lb">TAPS</div>`;
      $("grid").append(el);
      cards.set(p.id, el);
    }
    el.querySelector(".nm").textContent = p.name;
    el.querySelector(".ct").textContent = p.taps;
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/host`);

  ws.onopen = () => { $("dot").className = "on"; $("cs").textContent = "サーバー接続済み"; };
  ws.onclose = () => {
    $("dot").className = ""; $("cs").textContent = "サーバー切断 — 再接続中…";
    setTimeout(connect, 1000);
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "welcome") {
      $("url").textContent = msg.join_url;
    } else if (msg.type === "roster") {
      render(msg.players);
    } else if (msg.type === "join") {
      log(`+ ${msg.player.name} が参加`);
    } else if (msg.type === "leave") {
      log(`- ${msg.player.name} が退出`);
    } else if (msg.type === "tap") {
      const el = cards.get(msg.player.id);
      if (el) {
        el.querySelector(".ct").textContent = msg.player.taps;
        el.classList.add("hit");
        setTimeout(() => el.classList.remove("hit"), 120);
      }
      log(`  ${msg.player.name} → TAP (${msg.player.taps})`);
    }
  };
}

connect();
</script>
</body>
</html>
