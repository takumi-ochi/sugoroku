<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すごろく — 親機</title>
<link rel="stylesheet" href="/static/shared/dice.css">
<link rel="stylesheet" href="/static/shared/stages.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* display を持つ要素にも hidden 属性を効かせる */
  [hidden] { display: none !important; }
  body {
    margin: 0; height: 100vh; overflow: hidden; color: #eef0f5;   /* 背景は shared/stages.css（body には background を付けない） */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", sans-serif;
    display: flex; flex-direction: column;
  }

  body.playing main { padding: 18px 22px; }

  /* 開始前はQRだけの画面にする（盤はまだ見せない） */
  #lobby { display: none; }
  body.waiting main { display: none; }
  body.waiting #lobby {
    display: flex; flex: 1; min-height: 0; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
  }
  #lobby #qr2 { width: min(44vh, 44vw); height: auto; background: #fff; border-radius: 16px; padding: 14px; }
  #lobby .lead { font-size: 15px; color: #8b93a7; letter-spacing: .08em; }
  #lobbyurl { font-size: clamp(22px, 2.6vw, 34px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
  #chips .chip {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--c, #262a35);
    background: rgba(23,26,34,.78); font-size: 14px; font-weight: 700; color: var(--c, #8b93a7);
  }
  #lobbyctrl { display: flex; flex-direction: column; gap: 10px; width: min(100%, 420px); }
  .lead { font-size: 13px; color: #8b93a7; letter-spacing: .08em; }
  #right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  #conn { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #8b93a7; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #f87171; }
  #dot.on { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  #mute {
    background: none; border: 1px solid #3a4050; color: #8b93a7; border-radius: 9px;
    font-size: 18px; padding: 7px 11px; cursor: pointer; line-height: 1; font-family: inherit;
  }
  #mute:hover { border-color: #5c6478; }

  main { flex: 1; display: grid; grid-template-columns: 76px 1fr 340px; gap: 22px; padding: 22px 28px; min-height: 0; }

  /* ---- 左バー。音と接続状態を置く ---- */
  #rail { display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 0; }
  /* 左バーでは縦に積み、いちばん下に寄せる */
  #rail #right { margin-left: 0; margin-top: auto; flex-direction: column; gap: 12px; width: 100%; }
  #rail #conn { flex-direction: column; gap: 6px; text-align: center; font-size: 10px; line-height: 1.35; }

  /* ---- QRを大きく出す（左バーのボタンから） ---- */
  #qrmodal {
    position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 14, .95);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  }
  #qrbig { width: min(62vh, 62vw); height: auto; background: #fff; border-radius: 22px; padding: 20px; }
  #qrlead { font-size: 17px; color: #8b93a7; letter-spacing: .08em; }
  #qrurl { font-size: clamp(28px, 3.6vw, 52px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #qrclose {
    border: 1px solid #3a4050; background: none; color: #8b93a7; border-radius: 10px;
    font-size: 15px; font-family: inherit; padding: 11px 26px; cursor: pointer;
  }
  #qrclose:hover { border-color: #5c6478; color: #eef0f5; }

  /* ---- 盤面（外周に輪として並べる。配置は shared/ring.js） ---- */
  #board { display: grid; gap: 7px; height: 100%; min-height: 0; }
  .sq {
    position: relative; border-radius: 10px; padding: 5px 6px; min-height: 0; overflow: hidden;
    background: rgba(23,26,34,.78); border: 1px solid #262a35; display: flex; flex-direction: column;
    box-shadow: inset 0 0 14px -8px rgba(140, 170, 255, .55);
    transition: box-shadow .15s, border-color .15s;
  }
  .sq .no { font-size: 11px; color: #5c6478; font-variant-numeric: tabular-nums; }
  .sq .lb { font-size: 10px; line-height: 1.25; margin-top: 1px; font-weight: 600; }
  .sq .tokens { margin-top: auto; display: flex; flex-wrap: wrap; gap: 3px; }
  /* マスが多い盤（41マス以上）は、1マスが小さくなるので文字とコマも小さくする */
  #board.dense { gap: 5px; }
  #board.dense .sq { padding: 3px 4px; }
  #board.dense .sq .no { font-size: 9px; }
  #board.dense .sq .lb { font-size: 9px; line-height: 1.2; }
  #board.dense .sq .tokens { gap: 2px; }
  #board.dense .tk { width: 16px; height: 16px; font-size: 9px; }

  /* 2層目・3層目の盤は、くねくねした輪（配置は shared/ring.js の windingLayout）。
     マスは円形で、絶対位置に置く。輪の内側の手番とサイコロは、盤の真ん中に浮かべる。 */
  #board.winding { display: block; position: relative; }
  #board.winding #center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(44%, 420px); padding: 0; z-index: 2;
  }
  #board.winding .sq {
    position: absolute; border-radius: 50%; padding: 2px; align-items: center; justify-content: center;
    text-align: center; gap: 0; z-index: 1;
  }
  #board.winding .sq .no { font-size: calc(var(--fs) - 2px); line-height: 1; }
  #board.winding .sq .lb { font-size: var(--fs); line-height: 1.15; margin-top: 0; }
  #board.winding .sq .tokens { margin-top: 1px; justify-content: center; gap: 2px; }
  #board.winding .tk { width: var(--tk); height: var(--tk); font-size: calc(var(--tk) * .55); }
  #track { position: absolute; left: 0; top: 0; pointer-events: none; }
  #track path { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 10; stroke-linejoin: round; stroke-dasharray: 2 12; stroke-linecap: round; }

  /* 輪の内側。手番とサイコロを置く */
  #center {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 8px; min-height: 0;
  }
  #center > * { width: min(100%, 380px); }
  #center .dir { width: auto; font-size: 12px; color: #5c6478; letter-spacing: .1em; }
  .tk {
    width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 800; color: #0f1117; background: var(--c);
    box-shadow: 0 0 0 2px #0f1117;
  }
  .tk.rest { opacity: .4; }
  /* 階層。地上は縁なし、天空は青、宇宙は金 */
  .tk[data-l="2"] { box-shadow: 0 0 0 2px #0f1117, 0 0 0 4px #79b8ff; }
  .tk[data-l="3"] { box-shadow: 0 0 0 2px #0f1117, 0 0 0 4px #ffd54f, 0 0 10px 3px rgba(255, 213, 79, .55); }
  .tk.hop { animation: hop .18s ease; }
  @keyframes hop { 0% { transform: translateY(0) scale(1) } 50% { transform: translateY(-9px) scale(1.15) } 100% { transform: translateY(0) scale(1) } }

  .sq.start   { background: rgba(16,32,43,.78); border-color: #1d4a63; }
  .sq.start .lb { color: #4dd0e1; }
  .sq.forward { background: rgba(18,36,26,.78); border-color: #2c5f3f; }
  .sq.forward .lb { color: #81c784; }
  .sq.back    { background: rgba(42,29,20,.78); border-color: #6b4220; }
  .sq.back .lb { color: #ff9d5c; }
  .sq.half    { background: rgba(38,32,10,.8); border-color: #a8862a; }
  .sq.half .lb { color: #ffe08a; }
  .sq.rest    { background: rgba(31,26,43,.78); border-color: #4f3d73; }
  .sq.rest .lb { color: #ba8cff; }
  .sq.gain    { background: rgba(43,36,19,.78); border-color: #6b5a20; }
  .sq.gain .lb { color: #ffd54f; }
  .sq.lose    { background: rgba(42,22,24,.78); border-color: #6b2f33; }
  .sq.lose .lb { color: #ff6b7a; }
  .sq.card    { background: rgba(20,32,46,.78); border-color: #2f5a86; }
  .sq.card .lb { color: #79b8ff; }
  .sq.here    { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
  .sq.flash   { border-color: var(--fc, #fff); box-shadow: 0 0 22px -2px var(--fc, #fff); }

  /* ---- 右側 ---- */
  aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  #turn { font-size: 14px; text-align: center; padding: 10px; border-radius: 10px; background: rgba(23,26,34,.78); border: 1px solid #262a35; flex: none; }
  #turn b { font-size: 17px; color: var(--c, #eef0f5); }
  #turn .rd { font-size: 12px; color: #8b93a7; font-variant-numeric: tabular-nums; margin-bottom: 3px; letter-spacing: .05em; }
  #turn .ex { font-size: 12px; font-weight: 700; color: #79b8ff; margin-top: 5px; }

  #dice { border: 1px solid #262a35; border-radius: 14px; padding: 14px; text-align: center; background: rgba(23,26,34,.78); flex: none; }
  #dice .stage { --die: 104px; }
  #dicerow { display: flex; gap: 16px; align-items: center; justify-content: center; }
  #dicerow.two .stage { --die: 78px; }
  #who { font-size: 15px; font-weight: 700; color: var(--c, #5c6478); min-height: 1.3em; }
  #mv { font-size: 15px; font-weight: 600; color: #8b93a7; font-variant-numeric: tabular-nums; min-height: 1.3em; }
  #ef { font-size: 14px; font-weight: 700; min-height: 1.3em; }
  #ef.fw { color: #81c784; } #ef.bk { color: #ff9d5c; } #ef.rs { color: #ba8cff; }
  #ef.gn { color: #ffd54f; } #ef.ls { color: #ff6b7a; } #ef.cd { color: #79b8ff; }

  #list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 8px 11px;
    border-radius: 10px; border: 1px solid #262a35; background: rgba(23,26,34,.78);
  }
  .row.now { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, #171a22); }
  .row .rk { width: 30px; flex: none; font-size: 13px; font-weight: 800; color: #8b93a7; font-variant-numeric: tabular-nums; }
  .row .rk.top { color: #ffd54f; }
  .row .info { display: flex; flex-direction: column; min-width: 0; }
  .row .nm { font-weight: 700; color: var(--c); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .st { font-size: 11px; color: #8b93a7; font-variant-numeric: tabular-nums; }
  .row .mn { margin-left: auto; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .mn.bump { animation: bump .2s ease; }
  @keyframes bump { 50% { transform: scale(1.15); color: #ffd54f } }
  .row .kick {
    border: 1px solid #3a4050; background: none; color: #8b93a7; border-radius: 7px;
    font-size: 11px; padding: 4px 8px; cursor: pointer; font-family: inherit; flex: none;
  }
  .row .kick:hover { background: #f87171; border-color: #f87171; color: #14161c; }


  #ctrl { display: flex; gap: 8px; flex: none; }
  #ctrl button { flex: 1; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; }
  #start { background: #4dd0e1; color: #06202b; }
  #start:disabled { background: #262a35; color: #5c6478; cursor: not-allowed; }
  #finish { background: none; border: 1px solid #6b5a20 !important; color: #ffd54f; }
  #finish:hover { background: #241f14; }
  #reset { background: none; border: 1px solid #3a4050 !important; color: #8b93a7; }

  /* 明るい背景（地上・天空）でも読めるように、背景に直接乗るものへ暗い下地を敷く */
  #ctrl button { background: rgba(23, 26, 34, .85); }
  #start { background: #4dd0e1 !important; }
  #start:disabled { background: #262a35 !important; }
  #right { background: rgba(15, 17, 23, .6); border-radius: 12px; padding: 8px 6px; }
  #center .dir { background: rgba(15, 17, 23, .55); border-radius: 999px; padding: 4px 12px; color: #aab3c5; }

  #empty { color: #5c6478; font-size: 14px; text-align: center; padding: 18px; }

  /* 音がまだ鳴らせないときの案内。クリックすれば消える */
  #sndhint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
    background: #241f14; border: 1px solid #4a3f1e; color: #ffd54f;
    padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px -10px #000;
  }
</style>
</head>
<body data-stage="1">
  <div id="stagebg" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
  <div id="sndhint" hidden>🔈 画面のどこかをクリックすると音が鳴ります</div>

  <section id="lobby">
    <img id="qr2" src="/qr.svg" alt="参加用QRコード">
    <div class="lead">スマホでQRを読んで参加してください</div>
    <div id="lobbyurl">…</div>
    <div id="chips"></div>
    <div id="lobbyctrl"></div>
  </section>

  <main>
    <div id="rail">
      <div id="right">
        <button id="mute" title="音のオン/オフ">🔊</button>
        <div id="conn"><span id="dot"></span><span id="cs">未接続</span></div>
      </div>
    </div>

    <div id="board">
      <div id="center">
        <div id="turn">参加者を待っています</div>

        <div id="dice">
          <div id="who"></div>
          <div id="dicerow">
            <div class="stage"><div class="cube" id="cube"></div></div>
            <div class="stage" id="stage2" hidden><div class="cube" id="cube2"></div></div>
          </div>
          <div id="mv">サイコロ待ち</div>
          <div id="ef"></div>
        </div>

        <div class="dir">↻ 時計回りに一周してスタートへ</div>
      </div>
    </div>

    <aside>
      <div id="list"><div id="empty">まだ誰も参加していません</div></div>

      <div id="ctrl">
        <button id="start" disabled>ゲーム開始</button>
        <button id="finish" hidden>ここで終了</button>
        <button id="showqr" hidden>ゲーム終了</button>
        <button id="reset">リセット</button>
      </div>
    </aside>
  </main>

  <div id="qrmodal" hidden>
    <div id="qrlead">スマホでQRを読むか、ブラウザで次を開く</div>
    <img id="qrbig" src="/qr.svg" alt="参加用QRコード">
    <div id="qrurl">…</div>
    <button id="qrclose">とじる</button>
  </div>

<script type="module">
import { createDice } from "/static/shared/dice.js";
import * as sound from "/static/shared/sound.js";
import { sleep, walk, createQueue, RESULT_MS, EFFECT_MS } from "/static/shared/anim.js";
import { ringSize, ringLayout, windingLayout, WINDING } from "/static/shared/ring.js";
import {
  moneyLabel, deltaLabel, rankLabel, salaryLabel, halfwayLabel, moveLabel,
  rolledLabel, byRank, winnersLabel, effectStyle, statLabel, guardLabel, armedLabel, overLabel,
  stageLabel, viewLayer, climbLabel, goalLabel, CLIMB_CHIME, GOAL_CHIME,
  SALARY_CHIME, FINISH_CHIME, GUARD_CHIME, HALFWAY_CHIME,
} from "/static/shared/format.js";

const $ = (id) => document.getElementById(id);
const dice = createDice($("cube"));
const dice2 = createDice($("cube2"), true);   // 2個目は無音。転がる音が二重にならないように

/** サイコロの出目。カードで2個になっていれば2つ入る。 */
function rollValues(r) {
  return r.values && r.values.length ? r.values : [r.value];
}

function setDiceCount(n) {
  $("stage2").hidden = n < 2;
  $("dicerow").classList.toggle("two", n > 1);
}

function showDice(values, animate) {
  setDiceCount(values.length);
  dice.show(values[0], animate);
  if (values.length > 1) dice2.show(values[1], animate);
}

async function rollDice(values) {
  setDiceCount(values.length);
  if (values.length > 1) await Promise.all([dice.roll(values[0]), dice2.roll(values[1])]);
  else await dice.roll(values[0]);
}

/* ---- 音 ---- */
$("mute").textContent = sound.isMuted() ? "🔇" : "🔊";
$("mute").onclick = () => { $("mute").textContent = sound.toggleMute() ? "🔇" : "🔊"; };

// ブラウザは操作があるまで音を鳴らせない。鳴るようになるまで待ち受け、
// それまでは画面に案内を出す（スマホから開始してPCを触らない場合の無音対策）。
sound.armEnable((ready) => { $("sndhint").hidden = ready || sound.isMuted(); });

/* ---- 盤面 ---- */
let ws = null, state = null, shown = new Map(), lastSeq = null, lastClimb = null, firstState = true, animating = false;

function send(msg) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }

// マスを外周に輪として並べ、内側に手番とサイコロ（#center）を置く。
// 盤は階層ごとに違う。いま盤に出している階層（0 = まだ描いていない）。
let viewL = 0;

function boardOf(s, layer) { return s.boards[layer - 1]; }

function drawBoard(s, layer) {
  const board = $("board"), center = $("center");
  const info = boardOf(s, layer), squares = info.squares;
  const winding = !!WINDING[layer];
  board.querySelectorAll(".sq, #track").forEach((el) => el.remove());
  board.classList.toggle("winding", winding);
  board.classList.toggle("dense", !winding && squares.length > 40);

  let cells = null, wind = null;
  if (winding) {
    // くねくねの輪は盤の大きさ（ピクセル）から配置を決める。まだ大きさが無ければ描かない。
    const w = board.clientWidth, h = board.clientHeight;
    if (!w || !h) { viewL = 0; return; }
    wind = windingLayout(squares.length, w, h, WINDING[layer]);
    board.style.gridTemplateColumns = board.style.gridTemplateRows = "";
    center.style.gridArea = "";
    board.style.setProperty("--fs", (wind.tile >= 80 ? 11 : wind.tile >= 66 ? 10 : wind.tile >= 58 ? 9 : 8) + "px");
    board.style.setProperty("--tk", Math.max(12, Math.round(wind.tile * 0.27)) + "px");
    // 曲線そのものを、薄い点線の道として敷く
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.id = "track";
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", wind.path.map((q, i) => `${i ? "L" : "M"}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(" ") + " Z");
    svg.append(path);
    board.append(svg);
  } else {
    const { cols, rows } = ringSize(squares.length);
    cells = ringLayout(squares.length);
    board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    center.style.gridArea = `2 / 2 / ${rows} / ${cols}`;
  }

  squares.forEach((sq, i) => {
    const el = document.createElement("div");
    el.className = "sq " + sq.kind;
    el.id = "sq" + i;
    if (winding) {
      el.style.left = `${wind.points[i].x - wind.tile / 2}px`;
      el.style.top = `${wind.points[i].y - wind.tile / 2}px`;
      el.style.width = el.style.height = `${wind.tile}px`;
    } else {
      el.style.gridRow = cells[i].row;
      el.style.gridColumn = cells[i].col;
    }
    let label = sq.kind === "start" ? `${sq.label}<br>通過 ${deltaLabel(info.salary)}` : sq.label;
    if (winding && sq.kind !== "start" && label) label = label.replace(" ", "<br>");   // 円の中で2行にする
    el.innerHTML = `<div class="no">${i}</div><div class="lb">${label || ""}</div><div class="tokens"></div>`;
    board.append(el);
  });
}

// 盤と背景を階層に合わせる。人は自分がいる階層の盤にしか出ない。
function setView(layer) {
  document.body.dataset.stage = layer;
  if (layer === viewL) return;
  viewL = layer;
  drawBoard(state, layer);
  drawTokens();
}

// 画面の大きさが変わったら、くねくねの盤は大きさから配置し直す（四角い輪はCSSが追従する）
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!state || !WINDING[viewL]) return;
    const layer = viewL;
    viewL = 0;
    setView(layer);
  }, 150);
});

function drawTokens(hopId) {
  if (!state) return;
  document.querySelectorAll(".tokens").forEach((t) => (t.innerHTML = ""));
  document.querySelectorAll(".sq.here").forEach((e) => e.classList.remove("here"));
  for (const p of state.players) {
    if (p.layer !== viewL) continue;      // 別の階層の人は、この盤には出ない
    const cell = $("sq" + (shown.has(p.id) ? shown.get(p.id) : p.pos));
    if (!cell) continue;
    const tk = document.createElement("div");
    tk.className = "tk" + (p.resting ? " rest" : "") + (p.id === hopId ? " hop" : "");
    tk.style.setProperty("--c", p.color);
    tk.textContent = p.name.slice(0, 1);
    tk.dataset.l = p.layer;              // 階層ごとに縁の色を変える
    tk.title = `${p.name}（${stageLabel(p.layer, state.stages)}）`;
    cell.querySelector(".tokens").append(tk);
    if (p.id === state.turn && !animating) cell.classList.add("here");
  }
}

function flashSquare(pos, color) {
  const cell = $("sq" + pos);
  if (!cell) return;
  cell.style.setProperty("--fc", color);
  cell.classList.add("flash");
  setTimeout(() => cell.classList.remove("flash"), 700);
}

// 参加者一覧（所持金の多い順）。文言は shared/format.js だけが作る。
function drawPanel() {
  const s = state, cur = s.players.find((p) => p.id === s.turn), t = $("turn");
  if (s.phase === "waiting") {
    t.textContent = s.players.length ? "「ゲーム開始」を押してください" : "参加者を待っています";
    t.style.removeProperty("--c");
  } else if (s.phase === "finished") {
    const win = s.players.find((p) => p.rank === 1);
    const clear = s.cleared && s.players.find((p) => p.id === s.cleared);
    const goal = clear ? goalLabel(clear.name) : "ゲーム終了";
    t.innerHTML = win
      ? `<div class="rd">${goal}</div>優勝 <b>${winnersLabel(s.players)}</b>　${moneyLabel(win.money)}`
      : "ゲーム終了";
    t.style.setProperty("--c", win ? win.color : "#eef0f5");
  } else if (cur) {
    // カードを使って待っているのか、溢れたカードを捨てているところなのかを出す
    const extra = cur.cards > s.card_limit
      ? overLabel(cur.cards - s.card_limit)
      : armedLabel(cur);
    t.innerHTML = `<div class="rd">${stageLabel(cur.layer, s.stages)}</div><b>${cur.name}</b> のばん`
      + (extra ? `<div class="ex">${extra}</div>` : "");
    t.style.setProperty("--c", cur.color);
  }

  $("list").innerHTML = s.players.length ? "" : `<div id="empty">まだ誰も参加していません</div>`;
  for (const p of byRank(s.players)) {
    const row = document.createElement("div");
    row.id = "row" + p.id;
    row.className = "row" + (p.id === s.turn ? " now" : "");
    row.style.setProperty("--c", p.color);
    const rank = s.phase === "waiting" ? "—" : rankLabel(p.rank);
    row.innerHTML =
      `<span class="rk${s.phase !== "waiting" && p.rank === 1 ? " top" : ""}">${rank}</span>` +
      `<div class="info"><span class="nm">${p.name}</span><span class="st">${statLabel(p, s.stages)}</span></div>` +
      `<span class="mn">${moneyLabel(p.money)}</span>`;
    const kick = document.createElement("button");
    kick.className = "kick"; kick.textContent = "切断";
    kick.onclick = () => send({ type: "kick", id: p.id });
    row.append(kick);
    $("list").append(row);
  }

  const playing = s.phase === "playing";
  const waiting = s.phase === "waiting";
  document.body.classList.toggle("playing", playing);   // 遊んでいる間はQRを隠す
  document.body.classList.toggle("waiting", waiting);   // 開始前はQRだけの画面

  // 操作パネルは1組だけ持ち、開始前はロビーへ、始まったら右側へ移す（二重に持たない）
  if (waiting) {
    $("lobbyctrl").append($("ctrl"));
    $("lobby").append($("right"));
    $("chips").innerHTML = s.players.length ? "" : `<div class="chip">まだ誰も参加していません</div>`;
    for (const p of s.players) {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.style.setProperty("--c", p.color);
      chip.textContent = p.name;
      $("chips").append(chip);
    }
  } else {
    document.querySelector("aside").append($("ctrl"));
    $("rail").append($("right"));
  }

  $("start").hidden = playing;
  $("finish").hidden = !playing;
  $("showqr").hidden = s.phase !== "finished";
  $("start").disabled = !s.players.length;
  $("start").textContent = s.phase === "finished" ? "もう一度あそぶ" : "ゲーム開始";
}

// 演出中だけ、その人の行の位置と金額を書き換える。
function stepRow(pid, pos) {
  const row = document.getElementById("row" + pid);
  if (!row) return;
  const p = state.players.find((x) => x.id === pid);
  row.querySelector(".st").textContent = statLabel(
    { pos, cards: p ? p.cards : 0, layer: p ? p.layer : 0, parts: p ? p.parts : 0 }, state.stages);
}

function stepMoney(pid, money) {
  const row = document.getElementById("row" + pid);
  if (!row) return;
  const el = row.querySelector(".mn");
  el.textContent = moneyLabel(money);
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

async function walkToken(pid, steps, onPass, onHalf) {
  const info = boardOf(state, viewL);     // いま盤に出している階層（演出中は振った人の階層）
  const to = await walk(shown.get(pid), steps, info.size, (pos, dir, i) => {
    shown.set(pid, pos);
    drawTokens(pid);
    stepRow(pid, pos);
    sound.stepTone(dir, i);
    if (dir > 0 && pos === 0) onPass();
    if (dir > 0 && pos === info.half_pos) onHalf();
  });
  shown.set(pid, to);
}

// 誰かが階層を登ったら、全員に見えるように知らせる（新しい通し番号のときだけ）
function announceClimb(s) {
  const c = s.last_climb;
  if (!c || c.seq === lastClimb) { if (!c) lastClimb = null; return; }
  const first = lastClimb === null && firstState;   // 途中から開いたときは鳴らさない
  lastClimb = c.seq;
  if (first) return;
  $("ef").textContent = climbLabel(c, s.stages);
  $("ef").className = c.heaven ? "gn" : "cd";
  sound.chime(c.heaven ? GOAL_CHIME : CLIMB_CHIME, 0.13);
}

async function apply(s) {
  const first = state === null;
  state = s;
  announceClimb(s);
  sound.setBgm(s.phase === "playing");        // BGMは遊んでいる間だけ
  if (s.phase !== "finished") showQR(false);   // 次のゲームが始まったら引っ込める

  const r = s.last_roll;
  // 最初の1回は演出しない（再読み込みや途中参加）。以降は出目が変わるたびに演出する。
  const animate = r && !firstState && r.seq !== lastSeq;
  firstState = false;

  // 盤と背景は、演出中は振った人の階層、それ以外は手番の人の階層
  setView(animate ? r.layer : viewLayer(s));

  // 動かす本人以外はサーバーの位置に合わせる。いなくなった人は消す。
  for (const p of s.players) if (!animate || p.id !== r.id) shown.set(p.id, p.pos);
  for (const id of [...shown.keys()]) if (!s.players.some((p) => p.id === id)) shown.delete(id);

  if (!animate) {
    drawPanel();
    if (r) { $("who").textContent = r.name; $("mv").textContent = moveLabel(r.from, r.to); showDice(rollValues(r), false); }
    else { $("who").textContent = ""; $("mv").textContent = "サイコロ待ち"; $("ef").textContent = ""; }
    lastSeq = r ? r.seq : null;
    drawTokens();
    return;
  }

  animating = true;
  const p = s.players.find((x) => x.id === r.id);
  if (!shown.has(r.id)) shown.set(r.id, r.from);

  $("dice").style.setProperty("--c", p ? p.color : "#8b93a7");
  $("who").textContent = r.name;
  $("mv").textContent = "";
  $("ef").textContent = "";
  $("ef").className = "";
  drawTokens();

  await rollDice(rollValues(r));

  // 出目が確定してから駒を動かす（value は出目の合計 + カードで足したぶん）
  $("mv").textContent = rolledLabel(r);
  await sleep(RESULT_MS);

  // 表示用の所持金。スタート通過やマスの効果のたびに足していき、最後にサーバーの値で締める。
  let money = r.before;
  const info = boardOf(s, r.layer);        // 振った人がいた階層の給料と半周ボーナス
  const onPass = () => {
    money += info.salary;
    stepMoney(r.id, money);
    $("ef").textContent = salaryLabel(info.salary);
    $("ef").className = "gn";
    flashSquare(0, "#4dd0e1");
    sound.chime(SALARY_CHIME);
  };
  // 半分の位置はぴったり止まらなくても通過するだけでもらえる。歩いている途中で判定する。
  const onHalf = () => {
    money += info.half_bonus;
    stepMoney(r.id, money);
    $("ef").textContent = halfwayLabel(info.half_bonus);
    $("ef").className = "gn";
    flashSquare(info.half_pos, "#79b8ff");
    sound.chime(HALFWAY_CHIME);
  };

  $("mv").textContent = moveLabel(r.from, r.land);
  await walkToken(r.id, r.value, onPass, onHalf);

  if (r.effect) {
    const style = effectStyle(info.squares[r.land].kind);
    $("ef").textContent = r.effect;
    $("ef").className = style.cls;
    flashSquare(r.land, style.color);
    sound.chime(style.chime);
    if (r.gain) { money += r.gain; stepMoney(r.id, money); }
    await sleep(EFFECT_MS);

    // おまもりは自動で発動する。誰が持っていたかはここで初めて分かる。
    if (r.blocked) {
      $("ef").textContent = guardLabel(r.blocked);
      $("ef").className = "gn";
      flashSquare(r.land, "#ffd54f");
      sound.chime(GUARD_CHIME);
      await sleep(EFFECT_MS);
    }
    if (r.shift) {
      await walkToken(r.id, r.shift, onPass, onHalf);
      $("mv").textContent = moveLabel(r.from, r.to);
    }
  }

  if (s.phase === "finished") {
    await sleep(RESULT_MS);
    sound.chime(FINISH_CHIME, 0.13);
  }

  lastSeq = r.seq;
  animating = false;
  // 最後は必ずサーバーの状態で描き直す。ここで手番と順位が更新される。
  setView(viewLayer(s));
  drawPanel();
  drawTokens();
}

const queue = createQueue(apply);

$("start").onclick = () => { sound.enable(); send({ type: "start" }); };
$("finish").onclick = () => {
  if (confirm("ここでゲームを終了して、いまの所持金で順位を決めますか？")) send({ type: "finish" });
};
$("reset").onclick = () => send({ type: "reset" });

/* ---- 参加用QR。ゲームが終わっても自動では出さない。
 * 結果を見終わって「ゲーム終了」ボタンを押したときだけ前面に出す。
 * 押せば閉じられる。もう一度始めれば自動で引っ込む。
 */
function showQR(on) { $("qrmodal").hidden = !on; }

$("showqr").onclick = () => showQR(true);
$("qrclose").onclick = () => showQR(false);
// 背景のどこを押しても閉じる（QRそのものを押したときは閉じない）
$("qrmodal").onclick = (e) => { if (e.target !== $("qrbig")) showQR(false); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") showQR(false); });

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/host`);
  // 文言は左バー（幅76px）にも収まる長さにしてある
  ws.onopen = () => { $("dot").className = "on"; $("cs").textContent = "接続OK"; };
  ws.onclose = () => {
    $("dot").className = ""; $("cs").textContent = "切断・再接続中";
    setTimeout(connect, 1000);
  };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "welcome") $("qrurl").textContent = $("lobbyurl").textContent = msg.join_url;
    else if (msg.type === "state") queue.push(msg);
  };
}

connect();
</script>
</body>
</html>
